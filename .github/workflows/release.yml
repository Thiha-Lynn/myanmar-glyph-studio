# Tag a version (git tag v1.0.0 && git push --tags) and this workflow
# builds every community font and attaches per-family zips (TTF + WOFF2 +
# proof sheet + OFL text) to a GitHub Release — a stable download link for
# people who will never open a repo.
name: Release fonts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # only this job writes, and only to attach the font zips to the tag —
    # plus the two the provenance attestation needs
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: pip install --require-hashes -r pipeline/requirements.txt

      - name: Unit tests
        run: python3 -m pytest pipeline/tests/ -q

      - name: Build, check and package every family
        run: |
          shopt -s nullglob
          mkdir -p release
          for project in projects/*/*.glyphstudio.json; do
            name=$(basename "$(dirname "$project")")
            echo "::group::Building $name"
            python3 pipeline/json_to_ufo.py "$project" "dist/$name"
            fontmake -u dist/$name/*.ufo -o ttf --output-dir "dist/$name"
            python3 pipeline/make_variable.py "$project" "dist/$name/variable"
            python3 pipeline/postbuild.py dist/$name/*.ttf dist/$name/variable/*.ttf
            for ttf in dist/$name/*.ttf dist/$name/variable/*.ttf; do
              fonttools ttLib.woff2 compress -o "${ttf%.ttf}.woff2" "$ttf"
            done
            python3 pipeline/proof.py dist/$name/*.ttf pipeline/test_corpus.txt \
              "dist/$name/proof.png"
            cp "projects/$name/OFL.txt" "dist/$name/" 2>/dev/null || true
            (cd "dist/$name" && zip -r "../../release/$name-fonts.zip" .)
            echo "::endgroup::"
          done

      - name: fontbakery QA (one invocation per family)
        run: |
          shopt -s nullglob
          for dir in dist/*/; do
            fontbakery check-universal --succinct -l WARN "$dir"*.ttf
            for vf in "$dir"variable/*-VF.ttf; do
              fontbakery check-universal --succinct -l WARN "$vf"
            done
          done

      - name: Attest what this run built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*.zip

      - name: Ship the provenance beside the files it describes
        run: cp "${{ steps.attest.outputs.bundle-path }}" release/font-zips.intoto.jsonl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            release/*.zip
            release/*.intoto.jsonl
          generate_release_notes: true
