# Publish the pipeline to PyPI — https://pypi.org/project/myanmar-glyph-studio/
#
# Uses PyPI Trusted Publishing (OIDC): no API token exists in this
# repository, its secrets, or anywhere else. One-time setup on the
# maintainer's pypi.org account (about a minute):
#
#   pypi.org → Account settings → Publishing → Add a new pending publisher
#     PyPI project name : myanmar-glyph-studio
#     Owner             : Thiha-Lynn
#     Repository name   : myanmar-glyph-studio
#     Workflow name     : publish.yml
#     Environment name  : pypi
#
# After that, every published GitHub release uploads itself, and the
# "Run workflow" button publishes whatever version is on main. PyPI
# refuses to overwrite an existing version, so neither path can
# double-publish.
#
# On pull requests that touch packaging, only the build-and-check half
# runs — nothing is uploaded.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r pipeline/requirements-publish.txt
          python -m build
          python -m twine check --strict dist/*
      - name: Show what would ship
        run: ls -l dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myanmar-glyph-studio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
