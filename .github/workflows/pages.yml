# Deploys the Glyph Studio (web/) to GitHub Pages so anyone can draw at
# https://<user>.github.io/<repo>/ without installing anything.
# One-time setup after pushing to GitHub: repo Settings → Pages →
# Source: "GitHub Actions".
name: Deploy studio to Pages

on:
  push:
    branches: [main]
    # projects/** so a new community font redeploys the gallery
    paths: ["web/**", "projects/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build the gallery data (committed TTFs under projects/)
        run: |
          # brotli is what lets make_gallery compress the WOFF2 webfont
          # kits — without it they are silently skipped
          pip install --require-hashes -r pipeline/requirements-tools.txt
          python3 pipeline/make_gallery.py web/gallery-data
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          # create the Pages site on first run — no manual settings step
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
