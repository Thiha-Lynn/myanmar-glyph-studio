# Deploys the Glyph Studio (web/) to GitHub Pages so anyone can draw at
# https://<user>.github.io/<repo>/ without installing anything.
# One-time setup after pushing to GitHub: repo Settings → Pages →
# Source: "GitHub Actions".
name: Deploy studio to Pages

on:
  push:
    branches: [main]
    # projects/** so a new community font redeploys the gallery
    paths: ["web/**", "projects/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the gallery data (committed TTFs under projects/)
        run: |
          pip install fonttools
          python3 pipeline/make_gallery.py web/gallery-data
      - uses: actions/configure-pages@v5
        with:
          # create the Pages site on first run — no manual settings step
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
