# OpenSSF Scorecard — an independent, automated audit of this repo's
# supply-chain hygiene (branch protection, token permissions, dependency
# update flow, SAST, dangerous workflow patterns). Results publish to the
# public API, which is what the README badge and scorecard.dev viewer read.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 2 * * 1"   # weekly, Monday 02:23 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results needs OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
