# Desktop builds: mac DMG, Windows installer, Linux AppImage/deb.
#
# Manual (workflow_dispatch) or on a published release, in which case the
# artifacts are also uploaded to that release. Deliberately NOT part of
# the PR-gating checks — the studio itself is tested by build.yml; this
# workflow only wraps it in Electron.
name: Desktop apps

on:
  workflow_dispatch:
  release:
    types: [published]
  # PRs that touch the desktop shell build all three platforms as a
  # non-required check — path-filtered so ordinary PRs never wait on it.
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    # only this job writes, and only to attach installers to a release —
    # plus the two the provenance attestation needs
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Bundle the WOFF2 webfont kits so the in-app gallery and showcase
      # render the built fonts offline, same as the deployed site.
      - name: Build gallery webfont kits
        run: |
          pip install fonttools brotli
          python pipeline/make_gallery.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron toolchain
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

      - name: Attest what this run built
        if: github.event_name == 'release'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # the three matrix jobs all upload to one release, so the
          # provenance bundle has to carry the platform in its name
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "desktop/dist/desktop-${{ matrix.os }}.intoto.jsonl"
          files=(desktop/dist/*.dmg desktop/dist/*.exe desktop/dist/*.AppImage
                 desktop/dist/*.deb desktop/dist/*.intoto.jsonl)
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
