name: Build fonts

on:
  push:
    branches: [main]
    paths: ["projects/**", "pipeline/**", ".github/workflows/build.yml"]
  # No path filter here on purpose: `build` is a REQUIRED status check in
  # branch protection, and a required check that never runs blocks the
  # merge forever — a web- or docs-only PR would sit at "Expected" with
  # nothing able to report it. Runs on every PR; ~2.5 min is cheap next to
  # an unmergeable pull request.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: pip install -r pipeline/requirements.txt

      - name: Unit tests (pipeline)
        run: python3 -m pytest pipeline/tests/ -q

      - name: Build every project font
        run: |
          shopt -s nullglob
          found=0
          for project in projects/*/*.glyphstudio.json; do
            found=1
            name=$(basename "$(dirname "$project")")
            echo "::group::Building $name"
            python3 pipeline/json_to_ufo.py "$project" "dist/$name"
            fontmake -u dist/$name/*.ufo -o ttf --output-dir "dist/$name"
            python3 pipeline/postbuild.py dist/$name/*.ttf
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "No projects/*/*.glyphstudio.json found — nothing to build."
          fi

      - name: Weight-variable build (one drawing → a wght axis)
        run: |
          shopt -s nullglob
          for project in projects/*/*.glyphstudio.json; do
            name=$(basename "$(dirname "$project")")
            echo "::group::Variable $name"
            python3 pipeline/make_variable.py "$project" "dist/$name/variable"
            python3 pipeline/postbuild.py dist/$name/variable/*.ttf
            echo "::endgroup::"
          done

      - name: Shaping proof sheets (HarfBuzz corpus)
        if: hashFiles('dist/**/*.ttf') != ''
        run: |
          shopt -s nullglob
          for ttf in dist/*/*.ttf; do
            echo "::group::Proofing $ttf"
            python3 pipeline/proof.py "$ttf" pipeline/test_corpus.txt \
              "$(dirname "$ttf")/proof.png"
            echo "::endgroup::"
          done

      - name: Toolchain regression — the sample font must shape completely
        if: hashFiles('dist/sample/*.ttf') != ''
        run: |
          python3 pipeline/proof.py dist/sample/*.ttf pipeline/test_corpus.txt \
            dist/sample/proof-check.png | tee proof-sample.log
          grep -q " 0 missing-glyph boxes" proof-sample.log

      - name: fontbakery QA (universal profile)
        if: hashFiles('dist/**/*.ttf') != ''
        run: |
          shopt -s nullglob
          # One invocation per family. fontbakery's family-wide checks
          # compare every file it is handed, so two projects at once read
          # as one family with two names — and the statics must not be
          # mixed with the variable build either, which has an fvar table
          # the others will never have.
          for dir in dist/*/; do
            echo "::group::fontbakery $(basename "$dir")"
            fontbakery check-universal --succinct -l WARN "$dir"*.ttf
            for vf in "$dir"variable/*-VF.ttf; do
              fontbakery check-universal --succinct -l WARN "$vf"
            done
            echo "::endgroup::"
          done

      - name: Web fonts (WOFF2)
        if: hashFiles('dist/**/*.ttf') != ''
        run: |
          shopt -s nullglob
          for ttf in dist/*/*.ttf; do
            fonttools ttLib.woff2 compress -o "${ttf%.ttf}.woff2" "$ttf"
          done

      - name: Upload built fonts + proofs
        if: hashFiles('dist/**/*.ttf') != ''
        uses: actions/upload-artifact@v7
        with:
          name: fonts
          path: |
            dist/**/*.ttf
            dist/**/*.woff2
            dist/**/proof.png

  # The job above shapes with HarfBuzz — Android, Chrome, Linux,
  # LibreOffice. Windows shapes with DirectWrite, and issue #14 assumed
  # that engine needed a volunteer with a Windows machine. It does not:
  # this runner IS a Windows machine with the real engine and the compiler
  # already installed, so the shipped fonts get diffed against HarfBuzz
  # here on every pull request. See pipeline/directwrite/README.md.
  directwrite:
    name: DirectWrite vs HarfBuzz
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only what the diff needs — fontmake and fontbakery build fonts,
      # and this job tests the ones already committed in projects/.
      - name: Install the shaping dependencies
        run: pip install "fonttools>=4.63.0" "uharfbuzz>=0.56.0"

      - name: Build the DirectWrite shaper
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd pipeline\directwrite
          cl /nologo /EHsc /O2 /std:c++17 DirectWriteShape.cpp

      - name: Windows must render every cluster as HarfBuzz does
        shell: pwsh
        run: |
          $failed = 0
          foreach ($font in Get-ChildItem projects/*/*.ttf) {
            foreach ($corpus in "spec_corpus", "word_corpus") {
              Write-Host "::group::$($font.BaseName) - $corpus"
              python pipeline/directwrite_check.py $font.FullName `
                --corpus pipeline/$corpus.txt
              if ($LASTEXITCODE -ne 0) { $failed = 1 }
              Write-Host "::endgroup::"
            }
          }
          exit $failed
