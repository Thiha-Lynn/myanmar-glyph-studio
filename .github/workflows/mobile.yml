# Build the phone apps — the same web/ directory as a real Android APK
# and a real iOS app.
#
# The native projects are NOT committed (see docs/MOBILE.md): `cap add`
# regenerates them, the same way web/gallery-data/ is regenerated. So
# every run starts from the configuration in mobile/ and proves that
# still works, rather than proving a checked-in project still compiles.
#
# On a published release the Android APK is attached, so there is an
# installable file for people who cannot or will not use a store. iOS is
# built but not attached: an .app that is not signed with an Apple
# Developer identity cannot be installed on a real device, and shipping
# one would be a download that does nothing.

name: Mobile apps

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "web/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    # Attaching the APK to a release is a write; the workflow default above
    # is read-only, so v0.7.0 built a perfectly good APK and was then
    # refused with "Resource not accessible by integration". Granted here
    # rather than at the top so the iOS job stays read-only.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          # Gradle cannot read Java 25 class files (major version 69).
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install and add the Android platform
        working-directory: mobile
        run: |
          # ci, not install: it installs exactly the committed lockfile
          # and fails if package.json disagrees, so the uuid override
          # cannot be quietly re-resolved away
          npm ci
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --console=plain
      - name: Name it after the release
        id: apk
        run: |
          src=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          # On a pull_request, GITHUB_REF_NAME is "46/merge" — a slash, so
          # naming the file after it makes cp try to write into a directory
          # that does not exist. Only a release ref is a usable filename.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev"
          fi
          out="myanmar-glyph-studio-${version}.apk"
          cp "$src" "$out"
          ls -l "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
      - name: Attest what this run built
        if: github.event_name == 'release'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Ship the provenance beside the APK
        if: github.event_name == 'release'
        run: cp "${{ steps.attest.outputs.bundle-path }}" android-apk.intoto.jsonl

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            android-apk.intoto.jsonl

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install and add the iOS platform
        working-directory: mobile
        run: |
          npm ci
          npx cap add ios
          npx cap sync ios
      - name: Build for the simulator
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Prove the studio is actually inside the bundle
        working-directory: mobile
        run: |
          # A build can succeed with an empty web directory; the app would
          # then launch to a white screen, which is how this first shipped.
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/js/savefile.js
          test -d ios/App/App/public/fonts
          echo "web assets present in the iOS bundle"
